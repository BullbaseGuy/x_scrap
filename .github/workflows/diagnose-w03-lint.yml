name: Temporary W03 Ruff Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ruff-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print concise Ruff findings
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch "${HEAD_REF}" "https://github.com/${REPOSITORY}.git" repo
          cd repo
          python -m pip install --quiet 'ruff>=0.8'
          ruff check --output-format=concise src tests scripts
