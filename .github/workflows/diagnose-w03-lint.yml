name: Temporary W03 Test Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Print concise pytest failures
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch "${HEAD_REF}" "https://github.com/${REPOSITORY}.git" repo
          cd repo
          python -m pip install --quiet -e '.[dev]'
          pytest -q --tb=short
