name: Temporary W07 Branch Snapshot

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temp-w07-snapshot.yml'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/x-user-timeline-v1
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Package current branch
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=.venv -czf /tmp/w07-branch-snapshot.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: x-scrap-w07-branch-snapshot
          path: /tmp/w07-branch-snapshot.tar.gz
          retention-days: 1
          if-no-files-found: error
