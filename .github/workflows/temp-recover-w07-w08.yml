name: Temporary Recover W07 W08

on:
  push:
    branches:
      - feature/x-user-timeline-v1
    paths:
      - '.github/workflows/temp-recover-w07-w08.yml'

permissions:
  contents: write

concurrency:
  group: temporary-recover-w07-w08
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: feature/x-user-timeline-v1
      TWS_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Reconstruct reviewed update safely
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import re
          import tarfile
          from pathlib import Path

          root = Path('.bootstrap')
          if not root.is_dir():
              raise SystemExit('missing .bootstrap directory')

          def natural_key(path: Path):
              return [int(token) if token.isdigit() else token.lower() for token in re.split(r'(\d+)', path.name)]

          all_candidates = sorted(
              (path for path in root.iterdir() if path.is_file() and 'w07-w08' in path.name.lower()),
              key=natural_key,
          )
          parts = [
              path
              for path in all_candidates
              if re.search(r'(?:part|chunk)[-_]?\d+', path.name, re.IGNORECASE)
          ]
          selected = parts or [
              path
              for path in all_candidates
              if path.name.lower().endswith('.b64') and 'manifest' not in path.name.lower()
          ]
          if not selected:
              names = ', '.join(path.name for path in all_candidates) or '<none>'
              raise SystemExit(f'no staged W07/W08 archive parts found; candidates={names}')

          encoded = ''.join(''.join(path.read_text(encoding='utf-8').split()) for path in selected)
          try:
              payload = base64.b64decode(encoded, validate=True)
          except Exception as exc:
              details = ', '.join(f'{path.name}:{path.stat().st_size}' for path in selected)
              raise SystemExit(f'invalid staged base64 ({details}): {type(exc).__name__}') from exc

          archive = Path('/tmp/w07-w08-update.tar.gz')
          archive.write_bytes(payload)
          with tarfile.open(archive, 'r:gz') as handle:
              members = handle.getmembers()
              for member in members:
                  destination = (Path.cwd() / member.name).resolve()
                  if Path.cwd().resolve() not in destination.parents and destination != Path.cwd().resolve():
                      raise SystemExit(f'unsafe archive member: {member.name}')
                  if member.issym() or member.islnk():
                      raise SystemExit(f'archive links are forbidden: {member.name}')
              handle.extractall(Path.cwd(), filter='data')
          print(f'reconstructed {len(payload)} bytes from {[path.name for path in selected]}')
          PY
      - name: Remove all temporary publication surfaces
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          find .github/workflows -maxdepth 1 -type f -name 'temp-*.yml' -delete
      - name: Install deterministic development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run complete pre-publication gate
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src tests scripts
          ruff check src tests scripts
          pytest -q
          python scripts/devflow/validate_state.py --all-active --no-git
          python scripts/devflow/secret_audit.py
      - name: Publish gated W07 and W08 changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No reviewed update remained to publish'
            exit 0
          fi
          git commit -m 'feat: complete coverage export and recovery gates'
          git push origin "HEAD:${TARGET_BRANCH}"
