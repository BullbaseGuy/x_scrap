name: Temporary Apply W09 Preparation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temp-apply-w09-prep.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: feature/x-user-timeline-v1
      TWS_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Reconstruct and apply reviewed W09 preparation
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/w09-prep/chunk-* > /tmp/w09-prep.tar.gz.b64
          base64 --decode /tmp/w09-prep.tar.gz.b64 > /tmp/w09-prep.tar.gz
          echo '44d5e1893b88ce6faee3af75a4f34c4db4ba342378e9f8544d5df4f130d88ec1  /tmp/w09-prep.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/w09-prep.tar.gz -C .
          rm -rf .bootstrap/w09-prep
          rmdir .bootstrap 2>/dev/null || true
          rm .github/workflows/temp-apply-w09-prep.yml
      - name: Install deterministic development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run complete pre-publication gate
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src tests scripts
          ruff check src tests scripts
          pytest -q
          python scripts/devflow/validate_state.py --all-active --no-git
          python scripts/devflow/secret_audit.py
          git diff --check
          test ! -e .bootstrap
          test ! -e .github/workflows/temp-apply-w09-prep.yml
      - name: Publish gated W09 preparation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898247+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'feat: automate W09 local acceptance evidence'
          git push origin "HEAD:${TARGET_BRANCH}"
