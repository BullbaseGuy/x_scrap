name: Temporary Kick Timeline Cursor Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temp-kick-timeline-cursor.yml'

permissions:
  contents: write

concurrency:
  group: temporary-kick-timeline-cursor-fix
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: feature/x-user-timeline-v1
      TWS_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Execute reviewed hotfix payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source_path = Path('.github/workflows/temp-fix-timeline-cursor.yml')
          source = source_path.read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit('reviewed hotfix payload markers are invalid')
          payload = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          exec(compile(textwrap.dedent(payload), str(source_path), 'exec'), {'__name__': '__main__'})
          Path('.github/workflows/temp-kick-timeline-cursor.yml').unlink()
          PY
      - name: Install deterministic development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run complete hotfix gate
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src tests scripts
          ruff check src tests scripts
          pytest -q
          python scripts/devflow/validate_state.py --all-active --no-git
          python scripts/devflow/secret_audit.py
          git diff --check
          test ! -e .github/workflows/temp-fix-timeline-cursor.yml
          test ! -e .github/workflows/temp-kick-timeline-cursor.yml
      - name: Publish gated hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'fix: handle truncated recent timeline pagination'
          git push origin "HEAD:${TARGET_BRANCH}"
