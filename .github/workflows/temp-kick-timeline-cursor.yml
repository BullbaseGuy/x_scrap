name: Temporary Kick Timeline Cursor Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temp-kick-timeline-cursor.yml'

permissions:
  contents: write

concurrency:
  group: temporary-kick-timeline-cursor-fix
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: feature/x-user-timeline-v1
      TWS_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply reviewed timeline pagination compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          service_path = Path('src/x_scrap/service.py')
          service = service_path.read_text(encoding='utf-8')
          replacements = [
              (
                  '''                timeline_suspect_empty = await self._collect_timeline(\n''',
                  '''                (\n                    timeline_suspect_empty,\n                    timeline_truncated_sources,\n                ) = await self._collect_timeline(\n''',
              ),
              (
                  '''                if timeline_suspect_empty:\n                    coverage["warnings"] = [\n                        *coverage.get("warnings", []),\n                        "recent timeline endpoints returned no pages; historical search supplied the observable records",\n                    ]\n                coverage_status = coverage["status"]\n''',
                  '''                if timeline_suspect_empty:\n                    coverage["warnings"] = [\n                        *coverage.get("warnings", []),\n                        "recent timeline endpoints returned no pages; historical search supplied the observable records",\n                    ]\n                if timeline_truncated_sources:\n                    coverage["warnings"] = [\n                        *coverage.get("warnings", []),\n                        "recent timeline pagination stopped after the upstream empty-page guard while a cursor remained; exact historical search remained the coverage authority",\n                    ]\n                    coverage["timeline_truncated_sources"] = timeline_truncated_sources\n                coverage_status = coverage["status"]\n''',
              ),
              (
                  '''    ) -> bool:\n        sources = [\n''',
                  '''    ) -> tuple[bool, list[str]]:\n        sources = [\n''',
              ),
              (
                  '''        ]\n        for source, scope_key, factory in sources:\n''',
                  '''        ]\n        truncated_sources: list[str] = []\n        for source, scope_key, factory in sources:\n''',
              ),
              (
                  '''                if scope["state"] == "EXHAUSTED":\n                    self.pages.complete_scope(job_id, scope_key)\n                    break\n\n                stats = self.pages.scope_stats(job_id, scope_key)\n''',
                  '''                if scope["state"] == "EXHAUSTED":\n                    self.pages.complete_scope(job_id, scope_key)\n                    break\n                if scope["state"] == "LIMIT_REACHED":\n                    if scope.get("last_error") == "UPSTREAM_TIMELINE_CURSOR_REMAINS":\n                        truncated_sources.append(source)\n                    break\n\n                stats = self.pages.scope_stats(job_id, scope_key)\n''',
              ),
              (
                  '''                    self._finish_scope_after_stream(\n                        job_id,\n                        scope_key,\n                        allow_limit=limit > 0,\n                        limit_reason="CONFIGURED_TIMELINE_LIMIT",\n                    )\n                    break\n''',
                  '''                    cursor_remains_reason = (\n                        "CONFIGURED_TIMELINE_LIMIT"\n                        if limit > 0\n                        else "UPSTREAM_TIMELINE_CURSOR_REMAINS"\n                    )\n                    exhausted = self._finish_scope_after_stream(\n                        job_id,\n                        scope_key,\n                        allow_limit=True,\n                        limit_reason=cursor_remains_reason,\n                    )\n                    if not exhausted and limit < 0:\n                        truncated_sources.append(source)\n                    break\n''',
              ),
              (
                  '''            self.db.add_event(\n                job_id,\n                "TIMELINE_SOURCE_COMPLETE",\n                {\n                    "source": source,\n                    "state": final_scope["state"] if final_scope else "UNKNOWN",\n                    "pages": final_stats["page_count"],\n                    "count": final_stats["accepted_count"],\n                },\n            )\n''',
                  '''            final_reason = final_scope.get("last_error") if final_scope else None\n            event_type = (\n                "TIMELINE_SOURCE_TRUNCATED"\n                if final_reason == "UPSTREAM_TIMELINE_CURSOR_REMAINS"\n                else "TIMELINE_SOURCE_COMPLETE"\n            )\n            self.db.add_event(\n                job_id,\n                event_type,\n                {\n                    "source": source,\n                    "state": final_scope["state"] if final_scope else "UNKNOWN",\n                    "reason": final_reason,\n                    "pages": final_stats["page_count"],\n                    "count": final_stats["accepted_count"],\n                },\n            )\n''',
              ),
              (
                  '''        return suspect_empty\n\n    async def _collect_search_windows(\n''',
                  '''        return suspect_empty, sorted(set(truncated_sources))\n\n    async def _collect_search_windows(\n''',
              ),
          ]
          for old, new in replacements:
              count = service.count(old)
              if count != 1:
                  raise SystemExit(f'service replacement expected once, found {count}: {old[:80]!r}')
              service = service.replace(old, new, 1)
          service_path.write_text(service, encoding='utf-8')

          test_path = Path('tests/test_timeline_truncation.py')
          if test_path.exists():
              raise SystemExit('timeline truncation regression test already exists')
          test_path.write_text(
              '''import json\nfrom datetime import UTC, datetime, timedelta\nfrom pathlib import Path\n\nimport pytest\nfrom fakes import FakeAdapter, post, user\n\nfrom x_scrap.domain.pages import CollectorPage\nfrom x_scrap.service import UserExportService\nfrom x_scrap.storage.database import Database\n\n\n@pytest.mark.asyncio\nasync def test_timeline_empty_page_guard_is_explicitly_truncated_and_search_stays_authoritative(\n    tmp_path,\n):\n    start = datetime(2024, 1, 1, tzinfo=UTC)\n    cutoff = start + timedelta(days=1)\n    value = post(1, start + timedelta(hours=1))\n\n    class EmptyPageGuardAdapter(FakeAdapter):\n        def iter_user_tweet_pages(\n            self, user_id: str, *, cursor: str | None = None, limit: int = -1\n        ):\n            async def pages():\n                self.page_requests.append(("user_tweets", cursor, limit))\n                if cursor is None:\n                    yield CollectorPage(\n                        source="user_tweets",\n                        operation="UserTweets",\n                        request_cursor=None,\n                        next_cursor="opaque-next-cursor",\n                        items=(value,),\n                        raw_payload={\n                            "tweets": [value],\n                            "instructions": [\n                                {\n                                    "cursorType": "Bottom",\n                                    "value": "opaque-next-cursor",\n                                }\n                            ],\n                        },\n                    )\n\n            return pages()\n\n    adapter = EmptyPageGuardAdapter(\n        searches={"from:alice": [value]},\n        resolved_user=user(statuses_count=1),\n    )\n    database = Database(tmp_path / "jobs.db")\n    service = UserExportService(\n        adapter,\n        database,\n        exports_root=tmp_path / "exports",\n        raw_root=tmp_path / "raw",\n        heartbeat_interval=999,\n    )\n    result = await service.export_user("alice", start=start, cutoff=cutoff)\n\n    scope = service.pages.get_scope(result["job_id"], "timeline:user_tweets")\n    assert scope is not None\n    assert scope["state"] == "LIMIT_REACHED"\n    assert scope["last_error"] == "UPSTREAM_TIMELINE_CURSOR_REMAINS"\n    assert result["coverage_status"] == "COMPLETE_PUBLICLY_RETRIEVABLE"\n    assert result["post_count"] == 1\n\n    events = database.list_events(result["job_id"])\n    assert any(event["event_type"] == "TIMELINE_SOURCE_TRUNCATED" for event in events)\n    coverage = json.loads(\n        (Path(result["output_dir"]) / "coverage.json").read_text(encoding="utf-8")\n    )\n    assert coverage["timeline_truncated_sources"] == ["user_tweets"]\n    assert any("empty-page guard" in warning for warning in coverage["warnings"])\n''',
              encoding='utf-8',
          )

          for path in (
              '.github/workflows/temp-fix-timeline-cursor.yml',
              '.github/workflows/temp-kick-timeline-cursor.yml',
              '.github/workflows/temp-diagnose-timeline-cursor.yml',
              '.github/workflows/temp-apply-timeline-cursor-v2.yml',
          ):
              Path(path).unlink(missing_ok=True)
          PY
      - name: Install deterministic development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run complete hotfix gate
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src tests scripts
          ruff check src tests scripts
          pytest -q
          python scripts/devflow/validate_state.py --all-active --no-git
          python scripts/devflow/secret_audit.py
          git diff --check
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'temp-*' -print -quit)"
      - name: Publish gated hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'fix: handle truncated recent timeline pagination'
          git push origin "HEAD:${TARGET_BRANCH}"
