name: Devflow State Consistency

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devflow-state-${{ github.ref }}
  cancel-in-progress: true

jobs:
  state:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate canonical task state
        run: python scripts/devflow/validate_state.py --all-active --no-git
