name: Devflow Post Merge

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devflow-post-merge-main
  cancel-in-progress: false

jobs:
  exact-main:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run exact-main post-merge profile
        run: python scripts/devflow/run_gate.py post-merge
