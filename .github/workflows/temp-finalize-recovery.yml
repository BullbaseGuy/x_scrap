name: Temporary Finalize Recovery

on:
  push:
    branches:
      - feature/x-user-timeline-v1
    paths:
      - '.github/workflows/temp-finalize-recovery.yml'

permissions:
  contents: write

concurrency:
  group: temporary-recover-w07-w08
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: feature/x-user-timeline-v1
      TWS_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Assess recovered stage
        id: assess
        shell: bash
        run: |
          set -euo pipefail
          applied=false
          if test -f docs/implementation/x-user-timeline-v1/W07_result.md \
             && test -f docs/implementation/x-user-timeline-v1/W08_result.md \
             && test -f docs/implementation/x-user-timeline-v1/W09_plan.md \
             && grep -q '"current_stage": "W09"' docs/implementation/x-user-timeline-v1/task_state.yaml \
             && grep -q '"last_completed_stage": "W08"' docs/implementation/x-user-timeline-v1/task_state.yaml; then
            applied=true
          fi
          echo "applied=${applied}" >> "$GITHUB_OUTPUT"
          printf 'recovered_update=%s\n' "$applied"
      - name: Validate recovered product tree
        if: steps.assess.outputs.applied == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m compileall -q src tests scripts
          ruff check src tests scripts
          pytest -q
          python scripts/devflow/validate_state.py --all-active --no-git
          python scripts/devflow/secret_audit.py
      - name: Persist recovery assessment and remove temporary surfaces
        shell: bash
        env:
          APPLIED: ${{ steps.assess.outputs.applied }}
        run: |
          set -euo pipefail
          mkdir -p docs/implementation/x-user-timeline-v1
          cat > docs/implementation/x-user-timeline-v1/RECOVERY_STATUS.md <<EOF
          # W07/W08 publication recovery

          - Recovered update present: \`${APPLIED}\`
          - Temporary bootstrap payloads removed: \`true\`
          - Temporary write-capable workflows removed: \`true\`
          - Assessment source: repository contents and canonical task state

          If the recovered update is false, resume from the existing canonical W07 checkpoint; no W07/W08 completion claim is made.
          EOF
          rm -rf .bootstrap
          find .github/workflows -maxdepth 1 -type f -name 'temp-*.yml' -delete
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: finalize W07 W08 recovery (${APPLIED})"
          git push origin "HEAD:${TARGET_BRANCH}"
