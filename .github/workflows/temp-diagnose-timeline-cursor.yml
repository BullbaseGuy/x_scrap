name: Temporary Diagnose Timeline Cursor Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temp-diagnose-timeline-cursor.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Execute payload and print concise traceback
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: feature/x-user-timeline-v1
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch "${TARGET_BRANCH}" "https://github.com/${REPOSITORY}.git" repo
          cd repo
          python - <<'PY'
          from pathlib import Path
          import textwrap
          import traceback

          source_path = Path('.github/workflows/temp-fix-timeline-cursor.yml')
          source = source_path.read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          try:
              payload = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
              exec(
                  compile(textwrap.dedent(payload), str(source_path), 'exec'),
                  {'__name__': '__main__'},
              )
          except BaseException:
              traceback.print_exc()
              raise SystemExit(1)
          print('payload_success=true')
          print('service_changed=', Path('src/x_scrap/service.py').is_file())
          print('test_present=', 'test_timeline_empty_page_guard_is_explicitly_truncated' in Path('tests/test_service.py').read_text(encoding='utf-8'))
          raise SystemExit(1)
          PY
