name: Temporary Apply W09 Evidence Helper

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temp-apply-w09-evidence.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: feature/x-user-timeline-v1
      TWS_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Reconstruct reviewed W09 helper update
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < .bootstrap/w09-helper.tar.gz.b64)" -eq 17200
          base64 --decode .bootstrap/w09-helper.tar.gz.b64 > /tmp/w09-helper.tar.gz
          echo 'cd47553eda77c765edcae3c226e3dfdc366b8d1e2d2de2c35e5251fa3b788315  /tmp/w09-helper.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/w09-helper.tar.gz -C .
          rm -f \
            .github/workflows/temp-apply-w09-evidence.yml \
            .bootstrap/w09-helper.tar.gz.b64
          rmdir .bootstrap 2>/dev/null || true
      - name: Install deterministic development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run complete pre-publication gate
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src tests scripts
          ruff check src tests scripts
          pytest -q
          python scripts/devflow/validate_state.py --all-active --no-git
          python scripts/devflow/secret_audit.py
          git diff --check
      - name: Publish gated W09 evidence helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add redacted W09 evidence collector'
          git push origin "HEAD:${TARGET_BRANCH}"
