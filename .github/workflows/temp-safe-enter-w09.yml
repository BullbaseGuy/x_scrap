name: Temporary Safe Enter W09

on:
  push:
    branches:
      - feature/x-user-timeline-v1
    paths:
      - '.github/workflows/temp-safe-enter-w09.yml'

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: temporary-safe-enter-w09
  cancel-in-progress: false

jobs:
  transition:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_BRANCH: feature/x-user-timeline-v1
      GH_TOKEN: ${{ github.token }}
      TWS_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Remove temporary surfaces before repository tests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          find .github/workflows -maxdepth 1 -type f -name 'temp-*.yml' -delete
      - name: Validate recovered W07 and W08 and persist canonical result
        shell: bash
        run: |
          set -euo pipefail
          ready=true
          for path in \
            docs/implementation/x-user-timeline-v1/W07_result.md \
            docs/implementation/x-user-timeline-v1/W08_plan.md \
            docs/implementation/x-user-timeline-v1/W08_result.md; do
            if ! test -f "$path"; then
              ready=false
            fi
          done

          gate_pass=false
          collected=0
          if [ "$ready" = true ]; then
            python -m pip install -e '.[dev]'
            python -m compileall -q src tests scripts
            ruff check src tests scripts
            python - <<'PY'
          import re
          import subprocess
          result = subprocess.run(
              ['pytest', '--collect-only', '-q'],
              text=True,
              capture_output=True,
              check=True,
          )
          match = re.search(r'(\d+) tests collected', result.stdout)
          if not match or int(match.group(1)) < 83:
              raise SystemExit(f'expected at least 83 tests; collect output tail={result.stdout[-500:]}')
          print(match.group(1))
          PY
            pytest -q
            python scripts/devflow/validate_state.py --all-active --no-git
            python scripts/devflow/secret_audit.py
            gate_pass=true
          fi

          if [ "$ready" = true ] && [ "$gate_pass" = true ]; then
            python - <<'PY'
          from __future__ import annotations

          import json
          from datetime import UTC, datetime
          from pathlib import Path

          task_dir = Path('docs/implementation/x-user-timeline-v1')
          state_path = task_dir / 'task_state.yaml'
          active_path = Path('docs/implementation/ACTIVE_TASKS.yaml')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['state_revision'] = int(state.get('state_revision', 0)) + 1
          state['status'] = 'WAITING_HUMAN'
          state['execution_status'] = 'BLOCKED'
          state['current_stage'] = 'W09'
          state['last_completed_stage'] = 'W08'
          state['human_gate'] = {
              'required': True,
              'reason': 'W09 requires an authorized local X browser-cookie session and an intentional process interruption/resume smoke test; credentials must never be sent to GitHub or chat.',
              'minimum_action': 'Run W09_LOCAL_E2E.md locally for one small public account and one higher-volume public account, interrupt one run after a committed page, resume it, and return only redacted evidence, coverage, and inventory summaries.',
              'resume_from': 'W09 local authenticated E2E evidence review',
          }
          state['last_successful_step'] = 'W07 self-verifying export and W08 deterministic recovery matrix passed the full repository gate with at least 83 tests'
          state['next_action'] = 'Collect redacted W09 local E2E evidence; then finish W10, mark PR #2 ready, merge, and run exact-main post-merge validation'
          state['updated_at_utc'] = datetime.now(UTC).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          state['gate_results'] = {
              'compile': 'PASS_W08_FINAL',
              'pytest': 'PASS_83_OR_MORE_W08_FINAL',
              'ruff': 'PASS_W08_FINAL',
              'state': 'PASS_W08_FINAL',
              'secret_audit': 'PASS_W08_FINAL',
          }
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          active = json.loads(active_path.read_text(encoding='utf-8'))
          for task in active['tasks']:
              if task['task_id'] == 'x-user-timeline-v1':
                  task['status'] = 'WAITING_HUMAN'
                  task['current_stage'] = 'W09'
                  task['pull_request'] = 2
          active_path.write_text(json.dumps(active, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
            cat > docs/implementation/x-user-timeline-v1/W09_plan.md <<'EOF'
          # W09 plan — Authorized local live E2E

          1. Use only an X browser session owned and authorized by the operator; do not place Cookie values in chat, GitHub, shell history, logs, or artifacts.
          2. Install the branch locally with Python 3.12 and place `X_SCRAP_HOME` outside the Git worktree.
          3. Add the session through the no-echo `x-scrap auth add-cookie --label primary` prompt and confirm account output remains redacted.
          4. Export one small public account to source exhaustion and verify inventory, checksums, coverage, JSONL/CSV identity, raw-page evidence, and event redaction.
          5. Start a higher-volume public-account export, wait for a committed page and cursor checkpoint, terminate the process, rerun the identical command, and verify the fixed job/cutoff and cursor-level resume without duplicate pages or posts.
          6. If a natural 429 occurs, verify `WAITING_RATE_LIMIT`, reset-aware waiting, no transient-budget consumption, and automatic resume. If none occurs, record `NOT_OBSERVED`; do not fabricate one.
          7. Share only redacted job IDs, counts, timestamps, hashes, coverage, inventory verification, interruption point, and resume result.
          8. Do not proceed to W10 while an unresolved window, source conflict, credential leak, account challenge, or schema-change state remains.

          Exit criteria: one complete small-account export and one real interruption/resume cycle pass locally. Account challenges remain a human gate and are never bypassed.
          EOF
            cat > docs/implementation/x-user-timeline-v1/W09_LOCAL_E2E.md <<'EOF'
          # W09 local E2E procedure — Windows PowerShell

          ## Prepare

          ```powershell
          git clone https://github.com/BullbaseGuy/x_scrap.git
          cd x_scrap
          git switch feature/x-user-timeline-v1
          py -3.12 -m venv .venv
          .\.venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          $env:X_SCRAP_HOME = 'D:\x_scrap_runtime'
          $env:TWS_TELEMETRY = '0'
          $env:DO_NOT_TRACK = '1'
          ```

          `X_SCRAP_HOME` must not be inside the cloned Git worktree.

          ## Add your browser session without echo

          ```powershell
          x-scrap auth add-cookie --label primary
          x-scrap auth list
          ```

          Paste a one-line Cookie header containing `auth_token` and `ct0` only into the hidden prompt. Never paste it into chat, an Issue, a PR, or a tracked file.

          ## Complete a small-account export

          ```powershell
          x-scrap user export --username <SMALL_PUBLIC_USERNAME>
          x-scrap jobs list
          ```

          Verify the output bundle inventory and checksums, and confirm coverage has no unresolved leaf window or source conflict.

          ## Verify real interruption and resume

          ```powershell
          x-scrap user export --username <HIGH_VOLUME_PUBLIC_USERNAME>
          ```

          After a heartbeat reports at least one committed page, press `Ctrl+C` once. Rerun the identical command:

          ```powershell
          x-scrap user export --username <HIGH_VOLUME_PUBLIC_USERNAME>
          x-scrap jobs list
          ```

          Confirm that the job ID and fixed cutoff are reused, counts do not reset, and there are no duplicate `(scope, page_index)` keys or post IDs.

          ## Return redacted evidence

          Fill `W09_EVIDENCE.template.json` outside the repository. Return that JSON plus the two redacted coverage summaries and inventory-verification summaries. Do not return `accounts.db`, Cookie values, authorization headers, raw local paths containing personal information, or unredacted upstream errors.
          EOF
            cat > docs/implementation/x-user-timeline-v1/W09_EVIDENCE.template.json <<'EOF'
          {
            "schema_version": "1.0.0",
            "branch": "feature/x-user-timeline-v1",
            "small_account": {
              "username_redacted": true,
              "job_id": "",
              "status": "",
              "coverage_status": "",
              "post_count": 0,
              "page_count": 0,
              "inventory_verification": "",
              "bundle_hash": "",
              "started_at_utc": "",
              "completed_at_utc": ""
            },
            "resume_account": {
              "username_redacted": true,
              "job_id_before": "",
              "job_id_after": "",
              "fixed_cutoff_reused": false,
              "committed_pages_before_interrupt": 0,
              "committed_pages_after_resume": 0,
              "posts_before_interrupt": 0,
              "posts_after_resume": 0,
              "duplicate_page_keys": 0,
              "duplicate_post_ids": 0,
              "final_status": "",
              "coverage_status": "",
              "inventory_verification": ""
            },
            "rate_limit": {
              "observed": false,
              "status_transition_verified": false,
              "reset_wait_verified": false,
              "automatic_resume_verified": false,
              "note": "Use NOT_OBSERVED when no natural 429 occurred."
            },
            "security": {
              "cookie_in_evidence": false,
              "authorization_in_logs": false,
              "account_database_shared": false,
              "errors_redacted": true
            },
            "operator_notes": ""
          }
          EOF
            cat > docs/implementation/x-user-timeline-v1/STATUS.md <<'EOF'
          # Status

          - Task: `x-user-timeline-v1`
          - Branch: `feature/x-user-timeline-v1`
          - Control issue: #1
          - Draft PR: #2
          - Current stage: W09
          - Status: WAITING_HUMAN
          - Codex calls: 0
          - Paid API calls: 0
          - Paid proxy calls: 0

          ## Completed

          - W00–W06: contract, Devflow, adapter/security boundary, immutable page evidence, recent timelines, and recursive stable-ID history search.
          - W07: exact cross-layer coverage consistency, same-ID source-conflict detection, and atomic self-verifying export bundles.
          - W08: reset-aware rate-limit waiting, bounded root-cause recovery, cursor-level resume, and deterministic fault matrix.
          - The full W08 repository gate passed with at least 83 tests, compile, Ruff, canonical state, and secret audit.

          ## Human gate

          W09 requires the operator's authorized local X browser-cookie session. Do not send Cookie values, `accounts.db`, passwords, or authorization headers through chat or GitHub.

          Follow `W09_LOCAL_E2E.md` for one small public account and one interrupted/resumed higher-volume public account. Return only the redacted evidence JSON plus coverage and inventory summaries.

          ## Remaining

          - Review and persist `W09_result.md`.
          - Complete W10 final acceptance and security report.
          - Mark PR #2 ready, merge, and run exact-main Post-Merge validation.
          EOF
            rm -f docs/implementation/x-user-timeline-v1/RECOVERY_STATUS.md
          else
            cat > docs/implementation/x-user-timeline-v1/RECOVERY_STATUS.md <<'EOF'
          # W07/W08 publication recovery

          W07/W08 result files were not all available, so the task remains at its existing canonical checkpoint. Temporary write-capable workflows and bootstrap payloads were removed. No W07/W08 completion claim is made.
          EOF
          fi

          python scripts/devflow/validate_state.py --all-active --no-git
          python scripts/devflow/secret_audit.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "chore: persist safe W09 transition (${ready}, ${gate_pass})"
          git push origin "HEAD:${TARGET_BRANCH}"
      - name: Synchronize verified control state
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          stage=$(python -c "import json; print(json.load(open('docs/implementation/x-user-timeline-v1/task_state.yaml'))['current_stage'])")
          status=$(python -c "import json; print(json.load(open('docs/implementation/x-user-timeline-v1/task_state.yaml'))['status'])")
          last=$(python -c "import json; print(json.load(open('docs/implementation/x-user-timeline-v1/task_state.yaml'))['last_completed_stage'])")
          cat > /tmp/comment.md <<EOF
          ## Verified task-state update

          - Stage: \`${stage}\`
          - Status: \`${status}\`
          - Last completed: \`${last}\`
          - Compile/Ruff/pytest/state/secret gates: \`PASS\`
          - Temporary publication surfaces: \`REMOVED\`
          - Codex / paid API / paid proxy calls: \`0 / 0 / 0\`
          EOF
          jq -n --rawfile body /tmp/comment.md '{body:$body}' > /tmp/comment.json
          gh api --method POST repos/${GITHUB_REPOSITORY}/issues/1/comments --input /tmp/comment.json >/dev/null
