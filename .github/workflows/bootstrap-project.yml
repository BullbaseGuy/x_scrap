name: Bootstrap Project Tree

on:
  push:
    branches:
      - feature/x-user-timeline-v1
    paths:
      - .bootstrap/manifest.json
  pull_request:
    branches:
      - main
    paths:
      - .bootstrap/manifest.json
      - .github/workflows/bootstrap-project.yml

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
      - name: Reconstruct verified project archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-* > /tmp/x_scrap_project.tar.gz.b64
          base64 --decode /tmp/x_scrap_project.tar.gz.b64 > /tmp/x_scrap_project.tar.gz
          echo "842539f68d9187ae402a3c974ba13db7a66da09bbc38781e33e70e130dd61117  /tmp/x_scrap_project.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/x_scrap_project.tar.gz -C .
      - name: Commit generated project tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Project tree already present"
            exit 0
          fi
          git commit -m "build: bootstrap resumable X collector"
          git push origin "HEAD:${TARGET_BRANCH}"
