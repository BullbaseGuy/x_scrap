name: W09 Finalize Preparation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/w09-finalize-preparation.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: feature/x-user-timeline-v1
      TWS_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Reconstruct reviewed W09 preparation
        shell: bash
        run: |
          set -euo pipefail
          cat .w09-staging/w09-prep/part-* > /tmp/w09-prep.tar.gz.b64
          base64 --decode /tmp/w09-prep.tar.gz.b64 > /tmp/w09-prep.tar.gz
          echo '44d5e1893b88ce6faee3af75a4f34c4db4ba342378e9f8544d5df4f130d88ec1  /tmp/w09-prep.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/w09-prep.tar.gz -C .
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/live/run_e2e_case.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('    package_version,\n', '')
          text = text.replace(
              '            raise RuntimeError("planned interruption left no resumable job")',
              '            raise RuntimeError("planned interruption left no resumable job") from None',
          )
          path.write_text(text, encoding='utf-8')
          PY
          rm -rf .w09-staging
          rm .github/workflows/w09-finalize-preparation.yml
          rm -f .github/workflows/w09-ruff-diagnostic.yml
      - name: Install deterministic development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Ruff
        run: ruff check --output-format=concise src tests scripts
      - name: Pytest
        run: pytest -q --tb=short
      - name: State consistency
        run: python scripts/devflow/validate_state.py --all-active --no-git
      - name: Secret audit
        run: python scripts/devflow/secret_audit.py
      - name: Diff and temporary-surface checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e .w09-staging
          test ! -e .github/workflows/w09-finalize-preparation.yml
          test ! -e .github/workflows/w09-ruff-diagnostic.yml
      - name: Publish gated W09 preparation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'feat: automate W09 local acceptance evidence'
          git push origin "HEAD:${TARGET_BRANCH}"
