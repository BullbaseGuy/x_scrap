name: Temporary Apply W07 W08

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temp-apply-w07-w08.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: feature/x-user-timeline-v1
      TWS_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Reconstruct and apply reviewed update
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/temp-apply-w07-w08.yml
          base64 --decode .bootstrap/w07-w08-update.tar.gz.b64 > /tmp/w07-w08-update.tar.gz
          echo '0dd19679e1c896bde1485752d2afaa12389c05625cf0c775100e6d04eee6a98f  /tmp/w07-w08-update.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/w07-w08-update.tar.gz -C .
          rm .bootstrap/w07-w08-update.tar.gz.b64
          rmdir .bootstrap 2>/dev/null || true
      - name: Install deterministic development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run complete pre-publication gate
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src tests scripts
          ruff check src tests scripts
          pytest -q
          python scripts/devflow/validate_state.py --all-active --no-git
          python scripts/devflow/secret_audit.py
          git diff --check
      - name: Publish gated W07 and W08 changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: complete auditable exports and automatic recovery'
          git push origin "HEAD:${TARGET_BRANCH}"
