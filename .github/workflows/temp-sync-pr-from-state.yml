name: Temporary Sync PR From State

on:
  push:
    branches:
      - feature/x-user-timeline-v1
    paths:
      - '.github/workflows/temp-sync-pr-from-state.yml'

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: temporary-sync-pr-from-state
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: feature/x-user-timeline-v1
      GH_TOKEN: ${{ github.token }}
      TWS_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Remove temporary surfaces and publish cleanup first
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          find .github/workflows -maxdepth 1 -type f -name 'temp-*.yml' -delete
          python scripts/devflow/validate_state.py --all-active --no-git
          python scripts/devflow/secret_audit.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove temporary PR synchronization workflow'
          git push origin "HEAD:${TARGET_BRANCH}"
      - name: Generate PR body from canonical state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          state = json.loads(Path('docs/implementation/x-user-timeline-v1/task_state.yaml').read_text())
          stage = state['current_stage']
          status = state['status']
          last = state.get('last_completed_stage')
          metrics = state.get('metrics', {})
          completed_number = int(last[1:]) if isinstance(last, str) and last.startswith('W') else -1
          rows = [
              ('W00', 'contract, completeness boundary, risks, and plan'),
              ('W01', 'Devflow foundation and deterministic repository gates'),
              ('W02', 'upstream dependency and adapter contract'),
              ('W03', 'immutable page evidence and atomic cursor persistence'),
              ('W04', 'local credential isolation and security hardening'),
              ('W05', 'recent timeline collection and independent resume'),
              ('W06', 'stable-ID recursive historical search'),
              ('W07', 'cross-layer coverage, conflict detection, and verified exports'),
              ('W08', 'rate-limit-aware recovery and deterministic fault matrix'),
              ('W09', 'authorized local live E2E'),
              ('W10', 'final acceptance, merge, and exact-main validation'),
          ]
          checklist = []
          for code, label in rows:
              number = int(code[1:])
              checked = number <= completed_number
              checklist.append(f"- [{'x' if checked else ' '}] {code} {label}")
          gate = state.get('human_gate', {})
          body = f"""## Goal

          Build a local-first, zero-paid-API-cost, resumable and auditable collector for posts authored by one public X account.

          ## Confirmed boundaries

          - Python 3.12; `twscrape==0.19.2` isolated behind a replaceable adapter
          - browser-cookie authentication is local, no-echo, and never stored in GitHub or chat
          - no paid X API, paid proxy, purchased account, CAPTCHA bypass, or email automation
          - raw-page evidence, SQLite cursor checkpoints, stable-ID history search, coverage auditing, and deterministic recovery
          - Codex / paid API / paid proxy calls: `{metrics.get('codex_calls', 0)} / {metrics.get('paid_api_calls', 0)} / {metrics.get('paid_proxy_calls', 0)}`

          ## Canonical task state

          - Stage: `{stage}`
          - Status: `{status}`
          - Last completed: `{last}`

          ## Work packages

          {chr(10).join(checklist)}

          ## Current gate

          {gate.get('reason') or state.get('next_action')}

          This PR remains Draft until repository acceptance, security, and exact-main post-merge requirements are all satisfied. The checklist above is generated from `task_state.yaml`; it is not advanced manually.
          """
          Path('/tmp/pr-body.md').write_text(body, encoding='utf-8')
          Path('/tmp/status.json').write_text(json.dumps({
              'stage': stage,
              'status': status,
              'last_completed': last,
              'human_required': bool(gate.get('required')),
          }), encoding='utf-8')
          PY
          jq -n --rawfile body /tmp/pr-body.md '{body:$body}' > /tmp/pr.json
          gh api --method PATCH repos/${GITHUB_REPOSITORY}/pulls/2 --input /tmp/pr.json >/dev/null
          status=$(cat /tmp/status.json)
          jq -n --arg status "$status" '{body:("Canonical task-state synchronization completed: `" + $status + "`. Temporary write-capable workflow removed before this update.")}' > /tmp/comment.json
          gh api --method POST repos/${GITHUB_REPOSITORY}/issues/1/comments --input /tmp/comment.json >/dev/null
