name: W09 Ruff Diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/w09-ruff-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Print concise W09 Ruff findings
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          STAGED_COMMIT: b457c5d45ddbd8ff64f09d81ff967f3044d59ce8
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 "https://github.com/${REPOSITORY}.git" repo
          cd repo
          git fetch --quiet --depth 1 origin "${STAGED_COMMIT}"
          git checkout --quiet --detach "${STAGED_COMMIT}"
          cat .bootstrap/w09-prep-final/part-* > /tmp/w09-prep.tar.gz.b64
          base64 --decode /tmp/w09-prep.tar.gz.b64 > /tmp/w09-prep.tar.gz
          echo '44d5e1893b88ce6faee3af75a4f34c4db4ba342378e9f8544d5df4f130d88ec1  /tmp/w09-prep.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/w09-prep.tar.gz -C .
          rm -rf .bootstrap
          find .github/workflows -maxdepth 1 -type f -name 'temp-*.yml' -delete
          python -m pip install --quiet 'ruff>=0.8'
          ruff check --output-format=concise src tests scripts
