name: Temporary W04 Security Apply

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temp-branch-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: feature/x-user-timeline-v1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Reconstruct and verify W04 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .w04-patch/chunk-* > /tmp/w04.patch.gz.b64
          base64 --decode /tmp/w04.patch.gz.b64 > /tmp/w04.patch.gz
          echo '0cdfd8300372afa5fc8bb2fb55cc9025c17e39c79402a6a057be993149835411  /tmp/w04.patch.gz' | sha256sum --check --strict
          gzip --decompress --stdout /tmp/w04.patch.gz > /tmp/w04.patch
          git apply --check --binary /tmp/w04.patch
          git apply --index --binary /tmp/w04.patch
          rm -rf .w04-upload .w04-patch .github/workflows/temp-branch-snapshot.yml
          git add -A
      - name: Run complete deterministic gate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python scripts/devflow/run_gate.py repository-full
          git diff --check --cached
          test -z "$(git ls-files '.w04-upload/**' '.w04-patch/**' '.github/workflows/temp-branch-snapshot.yml')"
      - name: Commit W04 product changes and remove temporary surface
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: harden local credential and data isolation'
          git push origin "HEAD:${TARGET_BRANCH}"
