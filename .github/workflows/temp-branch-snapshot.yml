name: Temporary W04 Security Apply

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/temp-branch-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: feature/x-user-timeline-v1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Reconstruct and verify W04 payload
        shell: bash
        run: |
          set -euo pipefail
          cat .w04-upload/chunk-* > /tmp/w04-payload.tar.gz.b64
          base64 --decode /tmp/w04-payload.tar.gz.b64 > /tmp/w04-payload.tar.gz
          echo '7f647e5626d9f6192b7f3cb4bbc1ce35aa888e01581b1c996278804c09afc9d1  /tmp/w04-payload.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/w04-payload.tar.gz -C .
          rm -rf .w04-upload .github/workflows/temp-branch-snapshot.yml
      - name: Run complete deterministic gate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python scripts/devflow/run_gate.py repository-full
          git diff --check
      - name: Commit W04 product changes and remove temporary surface
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -z "$(git ls-files '.w04-upload/**' '.github/workflows/temp-branch-snapshot.yml')"
          git commit -m 'feat: harden local credential and data isolation'
          git push origin "HEAD:${TARGET_BRANCH}"
