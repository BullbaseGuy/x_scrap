name: Temporary W05 Apply

on:
  push:
    branches:
      - feature/x-user-timeline-v1
    paths:
      - '.w05-apply/**'
      - '.github/workflows/temp-w05-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-w05-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: feature/x-user-timeline-v1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Reconstruct verified W05 payload
        shell: bash
        run: |
          set -euo pipefail
          cat .w05-apply/chunk-* > /tmp/x-scrap-w05.tar.gz.b64
          base64 --decode /tmp/x-scrap-w05.tar.gz.b64 > /tmp/x-scrap-w05.tar.gz
          echo "b88a223f631b995e94132c8a5e3f45307dc51d056ad04ac968003396c9b6473a  /tmp/x-scrap-w05.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/x-scrap-w05.tar.gz -C .
          git rm -f .github/workflows/temp-w05-snapshot.yml
          git rm -rf .w05-apply .github/workflows/temp-w05-apply.yml
      - name: Apply deterministic formatting and gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          ruff check --fix src tests scripts
          python -m compileall -q src tests scripts
          ruff check src tests scripts
          pytest -q
          python scripts/devflow/validate_state.py --all-active --no-git
          python scripts/devflow/secret_audit.py
          git diff --check
      - name: Commit W05 and record product SHA
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete W05 recent timeline hardening"
          PRODUCT_SHA="$(git rev-parse HEAD)"
          python - "$PRODUCT_SHA" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("docs/implementation/x-user-timeline-v1/task_state.yaml")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["last_product_commit_sha"] = sys.argv[1]
          data["updated_at_utc"] = (
              datetime.now(timezone.utc)
              .replace(microsecond=0)
              .isoformat()
              .replace("+00:00", "Z")
          )
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY
          python scripts/devflow/validate_state.py --all-active --no-git
          python scripts/devflow/secret_audit.py
          git add docs/implementation/x-user-timeline-v1/task_state.yaml
          git commit -m "docs: record W05 product commit"
          git push origin "HEAD:${TARGET_BRANCH}"
